# javsubs.lua 配置
# 位置：<mpv 配置目录>/script-opts/javsubs.conf
# 所有项都可以删掉，删掉就用脚本里的默认值。

#---------------- 快捷键 ----------------
# 搜索当前视频的字幕
# 注意：别用 Ctrl+Shift+字母，mpv 会归一化成 Ctrl+字母（Ctrl+Shift+s == Ctrl+S，会和截屏撞）
key_search=Ctrl+Alt+s
# 手动输入关键词搜索（文件名不准时用）
key_manual_search=Ctrl+Alt+m

#---------------- 自动化 ----------------
# 打开文件后自动搜索：只弹一条 OSD 提示，不弹列表
auto_search=no
# 自动加载高置信度字幕：番号一致 + 时长吻合 + 中文
# 打开后基本可以做到“打开即看”，不需要按键
auto_load_best=no
# auto_load_best 的分数门槛（番号60 + 中文40 + 时长吻合70 = 170）
auto_load_min_score=120

#---------------- 字幕源 ----------------
# 可用的源：subtitlecat / xunlei
# 国内网络访问 SubtitleCat 常常超时，只想要迅雷的话改成 sources=xunlei
sources=subtitlecat,xunlei

subtitlecat_base=https://www.subtitlecat.com
xunlei_api=https://api-shoulei-ssl.xunlei.com/oracle/subtitle

#---------------- 网络 ----------------
# 单个请求超时（秒）
http_timeout=15
# 指定代理，例如 http://127.0.0.1:7890 ；留空则沿用系统/环境变量里的代理
proxy=
# 环境变量里的代理有问题时（表现为一直卡住），可以置为 yes 忽略它
ignore_env_proxy=no

#---------------- 结果筛选 ----------------
# 语言优先顺序，会挑条目里第一个可用的
prefer_langs=zh-CN,zh-TW
# yes = 只显示有中文字幕的条目；no = 英文等也显示
require_preferred_lang=yes
# SubtitleCat 每个条目要单独请求一次详情页才知道有哪些语言，
# 该值决定最多探测几条（越大越慢越全）
detail_probe_limit=8
# 详情页并发数
probe_concurrency=4
# 列表里最多显示多少条
max_results=30
# 快源（迅雷）返回后再等慢源（SubtitleCat）多久；超时先给部分结果
grace_seconds=1.5
# 列表显示多少秒后自动关闭（关闭时会一并释放 1~9 / Esc 按键）
pick_timeout=20
# 整轮搜索的兜底时限（秒）；0 = 自动（http_timeout x 6，最少 30）。
# 作用：万一某个字幕源的回调丢了，也不会让"搜索中"永久卡住
search_deadline=0

#---------------- 保存 ----------------
# same = 存到视频同目录（下次自动加载）；cache = 存到 mpv 配置目录 cache 下
save_dir=same
# 保存文件名模板，可用变量：{name} {lang} {ext}
filename_template={name}.{lang}.{ext}
# 字幕不是 UTF-8（迅雷多为 GBK）时自动设置 sub-codepage，避免乱码
codepage_fix=yes
# 上面用到的回退编码，gb18030 是 GBK 的超集
codepage_fallback=gb18030

#---------------- 调试 ----------------
# yes 会把请求 URL、命中数量等打到 mpv 控制台
debug=no
